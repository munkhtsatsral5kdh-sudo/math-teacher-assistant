<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Багш · Математик багшийн туслах</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,560;7..72,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css?v=switch">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20"><path d="M6 25 L16 7 L26 25" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10.5 18.5 H21.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </span>
        Математик багшийн туслах
      </a>
      <div class="me">
        <div class="avatar" id="me-avatar">МБ</div>
        <div>
          <div class="me-name" id="me-name">Математикийн багш</div>
          <div class="me-role">Багш · 6–9-р анги</div>
        </div>
      </div>
      <nav class="nav" aria-label="Багшийн цэс">
        <div class="nav-group">Үндсэн</div>
        <a href="/teacher/dashboard" data-view="dashboard"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>Тойм</a>
        <a href="/teacher/classes" data-view="classes"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Ангиуд</a>
        <a href="/teacher/content" data-view="content"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v15H6.5A2.5 2.5 0 0 0 4 19.5V4.5A2.5 2.5 0 0 1 6.5 2z"/></svg>Нийтлэл</a>
        <a href="/teacher/assistant" data-view="assistant"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>Туслах</a>
        <div class="nav-group">Хяналт</div>
        <a href="/teacher/grades" data-view="grades"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6"/><path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"/><path d="M7 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1"/></svg>Дүн</a>
      </nav>
      <div class="side-foot">
        <button type="button" id="rename-teacher"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg> Нэр солих</button>
        <a href="/"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Гарах</a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="actions">
          <button class="menu-btn" type="button" id="menu-btn" aria-label="Цэс">☰</button>
          <div class="topbar-title" id="topbar-title">Багшийн хяналтын самбар</div>
        </div>
        <div class="topbar-right">
          <span class="chip date" id="today"></span>
          <div class="avatar" id="top-avatar" aria-hidden="true">МБ</div>
        </div>
      </header>
      <main class="content">
        <nav class="part-switch" aria-label="Хэсэг солих">
          <a href="/student/lesson">Хичээл</a>
          <a href="/student/assignments">Даалгаврын сан</a>
          <a href="/teacher/content">Материал оруулах</a>
        </nav>
        <div id="view" tabindex="-1"></div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/cloud.js"></script>
  <script src="/js/curriculum.js"></script>
  <script src="/js/bank.js?v=units"></script>
  <script src="/js/store.js"></script>
  <script src="/js/quiz.js?v=units"></script>
  <script src="/js/teacher.js?v=join"></script>
  <script>
    document.querySelectorAll(".part-switch a").forEach((a) => {
      if (a.getAttribute("href") === location.pathname) a.classList.add("active");
    });
  </script>
</body>
</html>
